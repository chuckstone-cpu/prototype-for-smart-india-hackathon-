<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderly Care Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar / Navigation (Bottom on Mobile, Side on Desktop) -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-leaf"></i>
                <span>MindMate</span>
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#"><i class="fa-solid fa-house"></i> <span>Home</span></a></li>
                <li><a href="#"><i class="fa-solid fa-puzzle-piece"></i> <span>Games</span></a></li>
                <li><a href="#"><i class="fa-solid fa-heart-pulse"></i> <span>Health</span></a></li>
                <li><a href="#"><i class="fa-solid fa-utensils"></i> <span>Recipes</span></a></li>
            </ul>
            <div class="nav-bottom">
                <a href="#" class="help-btn"><i class="fa-solid fa-circle-question"></i> <span>Help</span></a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="greeting">
                    <h1>Good Morning, Sarah!</h1>
                    <p id="current-date">Tuesday, September 24</p>
                </div>
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Sarah&background=D32F2F&color=fff&size=64" alt="User Profile" class="avatar">
                </div>
            </header>

            <section class="daily-progress-section">
                <div class="progress-card">
                    <div class="progress-info">
                        <h2>Your Daily Goals</h2>
                        <p>You are doing great! Keep it up.</p>
                        <div class="progress-stats">
                            <span class="highlight">3</span> / 5 Completed
                        </div>
                    </div>
                    <div class="progress-circle-container">
                        <svg class="progress-circle" viewBox="0 0 36 36">
                            <path class="circle-bg"
                                d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <path class="circle"
                                stroke-dasharray="60, 100"
                                d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                        </svg>
                        <div class="circle-text">60%</div>
                    </div>
                </div>
            </section>

            <section class="activities-grid">
                <!-- Activity 1 -->
                <button class="activity-card color-blue">
                    <div class="card-icon">
                        <i class="fa-solid fa-brain"></i>
                    </div>
                    <div class="card-content">
                        <h3>Brain Games</h3>
                        <p>5 min play</p>
                    </div>
                    <div class="card-action">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </button>

                <!-- Activity 2 -->
                <button class="activity-card color-green completed">
                    <div class="card-icon image-icon">
                        <img src="REFERENCE%20for%20food/ChatGPT%20Image%20Sep%2024,%202026,%2011_19_11%20PM.png" alt="Food Recipe" style="width:100%; height:100%; border-radius:inherit; object-fit:cover;">
                    </div>
                    <div class="card-content">
                        <h3>Recipe of the Day</h3>
                        <p>Traditional meal</p>
                    </div>
                    <div class="card-action">
                        <i class="fa-solid fa-check-circle check-icon"></i>
                    </div>
                </button>

                <!-- Activity 3 -->
                <button class="activity-card color-red">
                    <div class="card-icon">
                        <i class="fa-solid fa-notes-medical"></i>
                    </div>
                    <div class="card-content">
                        <h3>Health Tips</h3>
                        <p>Stay hydrated</p>
                    </div>
                    <div class="card-action">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </button>

                <!-- Activity 4 -->
                <button class="activity-card color-purple">
                    <div class="card-icon">
                        <i class="fa-solid fa-person-walking"></i>
                    </div>
                    <div class="card-content">
                        <h3>Daily Workout</h3>
                        <p>10 min walk</p>
                    </div>
                    <div class="card-action">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </button>
            </section>



            <section class="vitals-section">
                <h2>Health Overview</h2>
                <div class="vitals-grid">
                    <div class="vital-card">
                        <div class="vital-header">
                            <h3>Blood Pressure</h3>
                            <span class="badge">Normal</span>
                        </div>
                        <div class="vital-value">
                            <span class="number">117</span><span class="unit">/82</span>
                        </div>
                        <p class="vital-desc">Last checked today at 8:00 AM</p>
                    </div>

                    <div class="vital-card">
                        <div class="vital-header">
                            <h3>Mood Today</h3>
                        </div>
                        <div class="mood-selector">
                            <button class="mood-btn" title="Sad"><i class="fa-regular fa-face-frown"></i></button>
                            <button class="mood-btn" title="Neutral"><i class="fa-regular fa-face-meh"></i></button>
                            <button class="mood-btn active" title="Happy"><i class="fa-regular fa-face-smile"></i></button>
                            <button class="mood-btn" title="Great"><i class="fa-regular fa-face-grin-stars"></i></button>
                        </div>
                    </div>
                </div>
            </section>
            
        </main>
    </div>
    
    <script>
        // Update date dynamically
        const dateElement = document.getElementById('current-date');
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        dateElement.textContent = new Date().toLocaleDateString('en-US', options);
    </script>
</body>
</html>
